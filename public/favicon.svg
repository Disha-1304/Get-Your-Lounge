<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Soft rounded background for high visibility on all browser tab themes -->
  <rect width="128" height="128" rx="28" fill="#FE2C1C" />
  
  <!-- Standalone Cocktail Glass Illustration -->
  <g fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round">
    <!-- Glass Bowl -->
    <polygon points="34,42 94,42 64,78" stroke-width="6.5" />
    <!-- Liquid line -->
    <line x1="42" y1="54" x2="86" y2="54" stroke-width="4.5" />
    <!-- Olive -->
    <circle cx="72" cy="54" r="7.5" fill="#FFFFFF" />
    <!-- Stick / Straw -->
    <line x1="68" y1="60" x2="98" y2="28" stroke-width="5" />
    <!-- Stem -->
    <line x1="64" y1="78" x2="64" y2="104" stroke-width="7" />
    <!-- Base -->
    <line x1="44" y1="104" x2="84" y2="104" stroke-width="7" />
    
    <!-- Sparkles -->
    <circle cx="86" cy="22" r="3.5" fill="#FFFFFF" stroke="none" />
    <circle cx="78" cy="34" r="2.5" fill="#FFFFFF" stroke="none" />
    <!-- Sparkle Cross -->
    <path d="M 64,20 L 64,30 M 59,25 L 69,25" stroke-width="3" />
  </g>
</svg>